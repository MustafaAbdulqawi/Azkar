name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Check Flutter environment
        run: |
          flutter doctor -v
          ls -la ios/Flutter/

      - name: Clean and prepare Flutter project
        run: |
          flutter clean
          flutter pub get
          flutter precache --ios  # نجيب ملفات Flutter المهمة لـ iOS

      - name: Ensure Release.xcconfig exists
        run: |
          mkdir -p ios/Flutter
          if [ ! -f ios/Flutter/Release.xcconfig ]; then
            echo "FlutterApp: Release config" > ios/Flutter/Release.xcconfig
            echo "Created a dummy Release.xcconfig"
          fi
          ls -la ios/Flutter/

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod deintegrate || true
          pod cache clean --all
          pod setup || true  # نضمن إن الـ CocoaPods جاهزة
          pod install --verbose
          ls -la Pods/ || echo "Pods directory not found"
          ls -la Pods/Target\ Support\ Files/Pods-Runner/ || echo "Pods-Runner files not found"
          cd ..

      - name: Build iOS app
        run: flutter build ios --release --no-codesign